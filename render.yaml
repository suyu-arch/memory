services:
  - type: web
    name: memory-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /v1/health
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile && pnpm db:generate &&
      pnpm turbo run build --filter=@togetherly/api --filter=@togetherly/worker
    startCommand: >-
      pnpm --filter @togetherly/api exec prisma db push --skip-generate &&
      node scripts/start-production.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: production
      - key: WEB_ORIGIN
        value: https://suyu-arch.github.io
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://xmhazpmxbrhncxxmxzjn.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://xmhazpmxbrhncxxmxzjn.supabase.co/auth/v1/.well-known/jwks.json
      - key: VALKEY_URL
        sync: false
      - key: S3_ENDPOINT
        value: https://xmhazpmxbrhncxxmxzjn.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: togetherly-private
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: CLOUD_VISION_ENABLED
        value: "false"
